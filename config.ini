; ============================================================
; XMAPort-18ProMax-to-14Pro 配置文件
; 目标: 将小米 18 Pro Max (madrid, HyperOS OS4) 移植到 小米 14 Pro (shennong)
; 源包: OS4.0.31.0.XEOCNXM (官方直链可用, 与 rom2 完美包同源版本; 回退可换 4.0.30 / 4.0.29)
; 底包: OS3.0.310.0.WNBCNXM  |  super: 8321499136 B  |  density: 560
; 编码: 本文件为 UTF-8, 脚本自动识别 UTF-8/GBK
; ============================================================

; ============================================
; XMAPort 配置文件
; 编码自动识别：UTF-8(GitHub 网页编辑) / ANSI-GBK(本地记事本) 均可
; ============================================
; 2026-11-06 构建触发方式：GitHub Actions 仅支持手动 workflow_dispatch，
; push / PR 不会触发云端构建（也不会产生被跳过的空 run）。
; 需要出包时：Actions -> Build XMAPort -> Run workflow，必填 device=shennong。
; 本机离线打包（不跑 Actions）的脚本模板见 tools/offline_flashpack/README.md。
;

; 目标设备平台：Qualcomm / MTK，必须按真实设备如实填写
; 填错会走错 vendor 处理分支（MTK 重打包 / 高通直复制），可能无法开机
device_platform=Qualcomm

; 固件校验按 [target] 版本自动选基线：
;    309 -> firmware_baseline.md5                     （真机验证可开机）
;    310 -> firmware_baseline_OS3.0.310.0.WNBCNXM.md5 （自洽性校验，未验证）
[source]
; 源 ROM（要移植出去的系统）官方完整卡刷包直链 zip
; 只能填直链，不能 fastboot 包、不能 ultimateota 开头的链接
; 留空 = 不下载，直接复用上次工作区里的源包数据
; Xiaomi 18 Pro Max (madrid)  HyperOS 4.0.31 / Android 17 (rom2 完美包同源版本)
; 回退可换 OS4.0.30.0.XEOCNXM/madrid-ota_full-OS4.0.30.0.XEOCNXM-user-17.0-c091a17250.zip
; 或 OS4.0.29.0.XEOCNXM/madrid-ota_full-OS4.0.29.0.XEOCNXM-user-17.0-0eb21bd563.zip
url=https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.31.0.XEOCNXM/madrid-ota_full-OS4.0.31.0.XEOCNXM-user-17.0-f68143ee30.zip

[target]
; 底包 ROM（目标设备的官方完整卡刷包）直链 zip，提供 odm / vendor 等分区
; 留空 = 不下载，直接复用上次工作区里的底包数据
; Xiaomi 14 Pro (shennong)  HyperOS 3.0.310 / Android 16
; 310 与 309 的 25 个物理固件分区 md5 全不同，两套固件不可混刷；固件校验
; 会按本链接的版本号自动选 devices/shennong/firmware_baseline_<版本>.md5。
; 回退时换回 OS3.0.309.0.WNBCNXM/shennong-ota_full-OS3.0.309.0.WNBCNXM-user-16.0-ab2b836306.zip
url=https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.310.0.WNBCNXM/shennong-ota_full-OS3.0.310.0.WNBCNXM-user-16.0-9a177484fc.zip

[settings]
; 下载设置（aria2c）
; 下载分块线程数（aria2 -s）
threads=16

; 单服务器最大连接数（aria2 -x）
; 官方 aria2 硬上限 16，填再大也会被 aria2 拒绝或忽略
max-connection=16

; 连接超时秒数
timeout=300

; 下载失败后的整体重试次数（0 = 只下载一次，不重试）
retry=5

; 外部工具 (payload-dumper-go / lpmake 等) 基础超时, 单位: 分钟
; 大 ROM 会按 payload/分区体积在此之上自动放大, 一般不用动
tool_timeout=10

; 用完即删: 各阶段用完后自动删除中间文件(下载zip/payload.bin/解出镜像)
; true = 推荐(CI 或小磁盘), 可省约 50GB; 复用 workspace 不受影响
auto_clean=true


; ROM 兼容性预检 (Step 0, 下载前按官方包名核对 Android 大版本)
; true  = 检查; 跨大版本时打印不开机风险报告
api_check=true

; 跨大版本时的处理:
; true  = auto 模式仅告警并继续 (交互模式无论如何都会再问一次)
; false = auto 模式直接中断, 必须先换同 Android 大版本的底包
allow_api_mismatch=true

[packing]
; ============================================
; 镜像打包
; ============================================
; 分区文件系统：erofs / ext4，必须与源 ROM 实际格式一致
format=erofs

; true=以310底包为骨架重建(实验性); false=源包为主+完美包基线对齐(推荐)
base_first=false

; 是否在打包后自动合成 super.img
; false 时可用主菜单 [A] 命令执行器 -> 1 单独合成
pack_super=false

; 是否生成 sparse 格式镜像（线刷一般要 true）
sparse=true

; 镜像内文件的时间戳；留空 = 自动用当前 UTC 时间
utc_stamp=

; erofs 压缩算法与级别（常用 lz4hc + 8；级别越高越小越慢）
compression=lz4hc
compression_level=9

; true = 启用旧内核兼容布局（mkfs.erofs -E legacy-compress）
; 仅老内核设备需要，新设备保持 false
erofs_old_kernel=false

; super 自适应: lpmake 空间不足时, 自动从 product 删最大的非保护应用
; (保护名单 keep_apps.conf 内的绝不动), 重打包重试直至塞进 device_size
auto_fit=true
; 自适应最多重试轮数: 源包越大缺口越大, 每轮删一批最大的非保护应用后重打包
; 4.0.29 源包本身比 4.0.27 大 ~600MB，再补回 VNDK v30~v33 (+245MB) 后
; 缺口约 580MB，放宽到 12 轮留足余量
auto_fit_rounds=12
; 打包完成后构建 线刷+卡刷 一体包 (XMAPort-Flash.bat / META-INF / images / zstd super)
; 产物: workspace/flashpack/ ; 构建期间需要约 12GB 额外磁盘
build_flashpack=true

; super 分区实际总大小(字节). 小米14 Pro(shennong) 实测为 7.75 GiB,
; 刷机前务必用实机校准: 手机进 fastboot 后运行 python tools/probe_super.py --write
; 填偏小 -> lpmake 报 not enough space; 填偏大 -> super.img 刷入被拒
device_size=8321499136

; metadata 分区大小（字节）
metadata_size=65536

; metadata 插槽数（A/B 设备一般 3）
metadata_slots=3

; 是否启用 Virtual A/B
virtual_ab=true

; super 分区名
super_name=super

; 动态分区组名：高通一般 qti_dynamic_partitions，MTK 一般 main
super_group=qti_dynamic_partitions

; ============================================
; 移植开关
; ============================================
; true  = 跳过 system_ext 重打包，直接复制源镜像（快；APEX 同步过会自动换旧版工具打包）
; false = 重新打包 system_ext（慢，但同步 APEX 后内容更完整）
is_skip_apex=false

; true = 向 odm build.prop 注入 adb/root 调试属性（ro.secure=0 等）
; 仅调试用途，日常使用的包建议关掉
enable_adb_debug=false

; false = 不强制 Vulkan/Skia 渲染后端（默认，与已验证基线一致）
; 源 ROM 是 Android 17 / OS4，底包 vendor 是 Android 16，强开
; debug.renderengine.vulkan=true / ro.hwui.use_vulkan=true 会让
; SurfaceFlinger/HWUI 起不来，症状就是卡在 HyperOS 开机动画。
; 只在确认 GPU 驱动兼容时才设 true
inject_vulkan_props=false

; true = 用空白禁用 vbmeta(未签名+flags=3) 替换底包签名 vbmeta，关闭 AVB 校验
; 资产位于 tools/assets/vbmeta_disabled.img 与 vbmeta_system_disabled.img
; 切勿在已签名的 vbmeta 上直接改 flags 字节——会破坏签名导致 ABL 拒绝启动
patch_vbmeta=true

; ============================================
; Build Prop Patch List —— 此标记行以下的 prop 会追加到目标 odm/etc/build.prop
; 可以自行增删 prop 行（从标记行到下一个 [section] 之间全部生效）
; 自行添加不保证开机
; ============================================

; ============================================
; 精简阶段 SHALLOW (Step 6: 移植之后 / 打包之前)
; 精简阶段由本项目自主实现与维护
; 机型资产目录: devices/<TARGET_DEVICE>/
; ============================================
[shallow]
; 总开关，false 时整个精简阶段跳过，直接打包
enable=true

; 跨版本兼容注入：把 devices/<代号>/compat/ 里的 VNDK v30~v33 APEX、
; 30.0 SELinux mapping、keystube.zip 等补进源分区。
; OS4.0.29 源包删掉了这些，不注入会卡 HyperOS 二屏且机身不热。
; 即使 enable=false（--skip-shallow）也会单独执行本步，保证包能开机。
inject_boot_compat=true

; true 时精简失败即中断移植流程（默认 false 只告警）
strict=false

; 按清单精简冗余应用
; 查找顺序: apps_list > devices/<代号>/remove_apps.conf > shallow/remove_apps.conf
remove_apps=true
apps_list=

; 注入机型文件: overlay / device_features / displayconfig / fstab / PowerKeeper
inject_device_files=true

; 替换相机(分片合并)与相机标定数据
replace_camera=true

; build.prop 补丁：统一 build.date / build.date.utc 为构建时刻
patch_build_prop=true
build_date=true

; 屏幕密度 persist.miui.density_v2，留空或 0 = 不修改
density=

; 开启 aptX Lossless（写入底包 vendor build.prop）
aptx_lossless=true

; 去除 Android 签名校验（services.jar smali patch，需要 java + tools/apktool.jar）
disable_signature_verification=false

; 打包前删除 system/framework/oat/*/services.{odex,vdex,art} 及 .fsv_meta
; 这些预编译产物绑定源 ROM 的 dex checksum（且带 fs-verity 元数据），一旦
; services.jar 被改写或底包 ART 版本不同就会失效，导致开机动画无限循环、
; 机身不发热、pstore 为空。已验证基线镜像同样不含这些文件。
; 删除后首次开机自动重新 dexopt，属正常现象（会发热、需 10-25 分钟）。
; 2026-11-15: 该步骤现在只删 system/framework/oat 下的 services.*，
; system_ext 的 miui-services oat 保留（同版本完美包与 V5 均保留，删光会卡二屏）。
drop_stale_services_oat=true

; 图标资源替换（需要联网 clone，较慢）
perfect_icons=false

; 固件层: KernelSU（需要 Linux + tools/linux/ksud + init_boot.img）
kernelsu=false

; 固件层: 内置 devices/<代号>/recovery.zip（需要完整包的 firmware-update 目录）
twrp_recovery=false

; 固件层: 释放 tools/flashtools.zip 刷机脚本到 workspace/combined
flash_tools=false

; 固件层: 移除 vendor init.qcom.rc 中的 start qti-testscripts
fix_init_rc=true

; ============================================
; patch build prop list
####################################
# from device/xiaomi/mivendor/common_rw.prop
####################################
# For common rw override property
#support night charge property
persist.vendor.night.charge=true
####################################
# from device/xiaomi/zero/odm/special_rw.prop
####################################
#support accelerate charge property
persist.vendor.accelerate.charge=true
#support battery health
persist.vendor.battery.health=true
#enable extreme battery
persist.vendor.extreme.mode=true
#support high temp dialog
persist.vendor.hightemp.notice=true
#support smart charge engine
persist.vendor.smartchg=854
#camera wechat beauty
persist.vendor.vcb.ability=true
persist.vendor.vcb.enable=false
ro.vendor.cabc.enable=false
ro.vendor.bcbc.enable=true
ro.vendor.dfps.enable=false
ro.vendor.fps.switch.default=true
ro.vendor.gcp.enable=1
ro.vendor.display.default_fps=120
ro.vendor.sre.enable=true
ro.vendor.localhbm.enable=true
ro.vendor.video_box.version=2
