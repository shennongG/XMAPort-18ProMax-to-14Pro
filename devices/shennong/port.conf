; ============================================
; Xiaomi 14 Pro / 14 Pro 钛金属版  (shennong)
; 机型档案 —— XMAPort-SHALLOW 精简阶段会按代号自动读取
; devices/<代号>/port.conf
; ============================================

[identity]
codename=shennong
name=Xiaomi 14 Pro / Xiaomi 14 Pro Ti
model=23116PN5BC / 23116PN5BG
region=cn

[hardware]
; SoC / 平台：高通 SM8650-AB，lpmake 走 Qualcomm 分支 (qti_dynamic_partitions)
soc=Snapdragon 8 Gen 3 (SM8650-AB)
soc_platform=Qualcomm
super_group=qti_dynamic_partitions

; 屏幕：1440x3200, 6.73", LTPO AMOLED 120Hz, ~522 ppi
display=1440x3200 LTPO AMOLED 120Hz (6.73")
; persist.miui.density_v2 可选值：留空=继承源 ROM；560=原生；480/440=更省电更大布局
density=

; super 分区大小（字节）。小米14 Pro(shennong) 实测为 7.75 GiB = 8321499136，
; 比 13/14 系部分机型的 12 GiB 小很多，移植大包时必须压到此值以内，否则 super.img 刷不进。
; 刷机前仍建议实机校准： fastboot getvar partition-size:super 或 python tools/probe_super.py --write
super_size=8321499136

[firmware]
; 官方停在当前大版本：HyperOS 3.0 / Android 16（截至 2026-10）
; 官方未提供 Android 17 底包，因此 Android 17 及更高版本的源 ROM 属于跨大版本移植
vendor_android=16
; 309 为真机验证过的回退底包（配 4.0.27 源，可正常开机）。
; 310 底包（配 4.0.29 源）需配合 devices/shennong/compat/ 的 VNDK v30~v33
; + 30.0 SELinux mapping 才能启动 userspace，详见
; firmware_baseline_OS3.0.310.0.WNBCNXM.md5 的说明。
vendor_max_hyperos=OS3.0.309.0.WNBCNXM

[base]
; 推荐底包（目标 ROM，提供 odm / vendor / boot）
; Recovery 卡刷完整包直链（2026-11-05 验证可访问，6.15 GiB）
; 309 为回退底包。当前构建用 310（见 config.ini [target]），
; verify_firmware.py 会按所选版本自动选对应固件基线校验。
base_url=https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.309.0.WNBCNXM/shennong-ota_full-OS3.0.309.0.WNBCNXM-user-16.0-ab2b836306.zip
base_android=16

[source]
; 本次使用的源 ROM（要移植过来的上层 system / product / mi_ext）
; Xiaomi 18 Pro Max = madrid, HyperOS 4.0 / Android 17（11.6 GiB）
; 27 为回退源包。当前构建用 29（见 config.ini [source]）。
source_codename=madrid
source_name=Xiaomi 18 Pro Max
source_url=https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.27.0.XEOCNXM/madrid-ota_full-OS4.0.27.0.XEOCNXM-user-17.0-61443770bf.zip
source_android=17

; 源 ROM Android 17 > 底包 Android 16 —— 跨大版本，务必先看 README 的兼容性章节
; 若确实要跨版本，建议：
;   1) is_skip_apex=false        —— 用底包的 APEX，避免新版本 apex 与旧 vendor 不兼容
;   2) enable_adb_debug=true     —— 便于首开 logcat 排错
;   3) patch_vbmeta=true         —— 关校验，否则必变砖
;   4) 首次精简建议 strict=false —— 精简失败不阻断，先看到镜像
[notes]
