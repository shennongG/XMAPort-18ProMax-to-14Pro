# product/etc/build.prop 移植适配属性（shennong）
#
# 来源：2026-11-21 逐键对比 X-MiPort 4.0.29 完美包（真机可开机）与本项目产物。
# 完美包 product/build.prop 比源包多 49 项、11 项取值不同；这里排除：
#   ro.product.port.device          —— 由脚本按真实源代号动态写入
#   ro.hwui.use_vulkan              —— 跨版本强开可能让 SF/HWUI 起不来（见 docs）
#
# 格式：key=value，写入时 add_if_missing，已存在则覆盖。
#
# --- A. 关闭 ART 预加载 / 预缓存 / prestart（跨版本移植关键）---
# 源包的预编译产物在目标底包上失效，开启预加载会加载失效类导致启动卡死。
# 完美包把这一组全部关掉，是本项目此前完全缺失的部分。
persist.sys.art_startup_class_preload.enable=false
persist.sys.precache.enable=false
persist.sys.preload.enable=false
persist.sys.app_dexfile_preload.enable=false
persist.sys.prestart.proc=false
persist.sys.prestart.feedback.enable=false
persist.sys.stability.PrereadEnable=false

# --- B. 机型/显示/性能适配 ---
persist.sys.enhance_vkpipelinecache.enable=true
persist.sys.power.default.powermode=enhance
persist.sys.power_mode_support=true
persist.vendor.accelerate.charge=true
sys.haptic.media=true
ro.odm.mm.vibrator.audio_haptic_support=true
persist.sys.miui_animator_sched.bigcores=2-6
persist.sys.miui_animator_sched.sched_threads=2
persist.sys.miui.sf_cores=4-7
persist.vendor.display.miui.composer_boost=4-7
persist.sys.miui_animator_sched.big_prime_cores=2-7
persist.sys.support_ultra_hdr=true
debug.game.video.speed=true
debug.game.video.support=true
persist.sys.stability.miui_fbo_enable=true
ro.crypto.state=encrypted
fw.max_users=1000
fw.show_multiuserui=1
ro.warranty_bit=0
ro.bootloader=locked
ro.boot.warranty_bit=0
ro.boot.flash.locked=1
ro.vendor.warranty_bit=0
ro.boot.veritymode=enforcing
ro.secureboot.lockstate=locked
ro.boot.verifiedbootstate=green
ro.vendor.boot.warranty_bit=0
ro.boot.vbmeta.device_state=locked
vendor.boot.verifiedbootstate=green
vendor.boot.vbmeta.device_state=locked
ro.mi.version.mi_product=empty
ro.vendor.mi_sf.aod_mode_ddic_refresh_rate=1
ro.miui.special.aod.mask=0.57
persist.sys.spc.mi_extra_free_game_only=true
persist.vendor.spc.mi_extra_free_game_only=true
ro.surface_flinger.game_default_frame_rate_override=60
dalvik.vm.default-dex2oat-cpu-set=0,1,2,3,4,5,6,7
dalvik.vm.boot-dex2oat-cpu-set=0,1,5,6
dalvik.vm.background-dex2oat-cpu-set=0,1,5,6
dalvik.vm.monitortimeout.enable=true
ro.product.port.autor=xmiport
ro.vendor.audio.sfx.scenario=true
ro.vendor.audio.scenario.support=true
ro.sf.support_privacy_shield=false
ro.miui.affinity.gameisforground=0-1,5-6
