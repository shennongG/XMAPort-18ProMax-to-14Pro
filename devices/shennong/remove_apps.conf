# XMAPort SHALLOW - 通用应用精简清单
#
# 位置: shallow/remove_apps.conf
# 覆盖优先级: config.ini [shallow] apps_list  >  devices/<代号>/remove_apps.conf  >  本文件
#
# 格式（每行一条，冒号分隔）:
#     <分区>:<分区内相对目录>:<目录名匹配规则>
#
#   <分区>      system / system_ext / product / mi_ext —— 对应 workspace/source_filesystem/<分区>/
#   <相对目录>  分区内的相对路径，写 "app"、"priv-app"、"system/app" 均可，脚本会自动适配
#               system-as-root 的 system/... 双层结构；data-app 与 data_app 视为等价
#   <匹配规则>
#               "=名字"   精确匹配目录名（不区分大小写）—— 推荐，行为与原 make.sh 一致
#               "名字"    小写子串匹配，命中即删除整个目录（风险较高，慎用）
#
# 保护名单优先生效： shallow/keep_apps.conf + devices/<代号>/keep_apps.conf
#   任何被保护名单命中的目录都不会被删除，即使本文件里写了它。
#
# 以 # 开头是注释；在行首加 "!" 可临时停用该条。
#
# --------------------------------------------------------------------
# 以下为迁移自 早期精简清单 的默认清单，全部改为精确匹配
# （保留 小爱/互联互通/互传/语音 等MIUI核心功能，剔除冗余与小米车机相关）
# --------------------------------------------------------------------

