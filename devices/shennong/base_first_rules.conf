# base_first 模式增量规则（shennong / 310 底包 + 4.0.29 源包）
#
# 格式: <动作> <分区|*>:<相对内容根的路径前缀>
#   keep  = 源包(4.0.29)优先，底包不覆盖这些路径
#   base  = 底包优先，且优先级高于 keep（给宽泛 keep 开例外）
#   drop  = 合并后删除（madrid 专属资源）
#   未命中 keep/base 的路径默认由底包覆盖 → 这才是「底包为骨架」
#
# 路径相对分区内容根：product/etc/build.prop 写 product:etc/build.prop
# 另见 devices/shennong/perfect_remove_paths.txt（258 个精确删除项，
# 由三方清单求差生成，脚本会在 product 上自动应用）。
#
# 注意：这是**初始目录级规则**，不是成品清单。其它作者的完美包是逐文件
# 挑选的增量；本规则需要在真机验证后按 logcat / 功能回归逐步细化到文件级。

# ---- 4.0.29 HyperOS 4 的核心增量，必须来自源包 ----
keep *:framework/
keep *:app/
keep *:priv-app/
keep *:data-app/
keep *:overlay/
keep *:etc/permissions/
keep *:etc/sysconfig/
keep *:etc/selinux/
keep *:lib/
keep *:lib64/
# 版本属性留在源包侧（密度由 fix_density_tree 改成 shennong 原生 560）
keep product:etc/build.prop

# ---- 底包骨架优先（覆盖上面的宽泛 keep）----
# 预编译 oat 用底包的：源包 oat 与底包 ART 版本不匹配会卡开机动画；
# 完美包与 V5 都保留底包自带的 miui-services oat（17~19 个本体文件）。
base *:framework/oat/

# 机型专属资源、密度、displayconfig、device_features、fstab、
# sensors / camera 配置等默认全部由底包覆盖，无需逐条列出。

# ---- madrid 专属资源，合并后删除 ----
drop product:media/rearscreen
drop product:app/subscreencenter
drop product:etc/precust_theme/theme/.data/content/rearscreen
drop product:etc/precust_theme/theme/.data/meta/rearscreen
