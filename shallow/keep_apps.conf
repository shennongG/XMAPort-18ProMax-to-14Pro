# XMAPort SHALLOW - 应用保护名单（白名单）
#
# 位置: shallow/keep_apps.conf
# 合并策略: devices/<代号>/keep_apps.conf  与  本文件  —— 两者同时生效（不是覆盖）
#
# 作用: 命中本名单的目录，即使同时被 remove_apps.conf 命中，也不会被删除。
#      这是跨 Android 大版本移植（如 shennong ← madrid）的安全阀：
#      新版本 ROM 会带来一批目录名相近、但缺失会直接开不了机的组件。
#
# 格式（每行一条，冒号分隔）:
#     <分区>:<分区内相对目录>:<目录名>
#
#   <分区>     system / system_ext / product / mi_ext，也可写 * 表示所有分区
#   <相对目录> app / priv-app 等；写 * 表示该分区下任意目录层级
#   <目录名>   目录名本身。"=" 前缀=精确匹配（推荐）；不带 = 则是小写子串匹配
#
# --------------------------------------------------------------------

# --- 桌面 / 系统 UI / 设置 ---
*:priv-app:=MiuiHome
*:priv-app:=Settings
*:priv-app:=SystemUI
*:priv-app:=MiuiSystemUI
*:priv-app:=MiuiSettings
*:app:=MiuiHome
product:priv-app:=MiuiCover
product:priv-app:=MiuiExtraMenu

# --- 框架 / 权限 / 账号（删了必开不了机） ---
*:priv-app:=PermissionController
*:priv-app:=MiuiFramework
*:app:=MiuiFramework
*:priv-app:=XiaomiAccount
*:app:=XiaomiAccount
*:app:=MiTrustService
*:app:=MiuiTrustService
*:priv-app:=MiuiPermissionUI
product:app:=MiuiSuperPowerService

# --- 电话 / 短信 / 联系人 / 通信基础 ---
system:system/priv-app:=Telecom
system:system/priv-app:=TelephonyProvider
system:system/priv-app:=Mms
system:system/priv-app:=Contacts
system:system/priv-app:=ContactsProvider
system:system/app:=ContactsProvider
*:priv-app:=MmsServiceNew
*:app:=MiuiVoipAssistant

# --- 下载 / 存储 / 证书 ---
system:system/priv-app:=DownloadProvider
system:system/priv-app:=ExternalStorageProvider
system:system/priv-app:=CertInstaller
system:system/priv-app:=KeyChain
system:system/priv-app:=ExtServices
system:system/priv-app:=DocumentsUI
system:system/priv-app:=Shell
system:system/priv-app:=Provision
system:system/priv-app:=SharedStorageBackup
system:system/priv-app:=BackupRestoreConfirmation

# --- 小爱语音 / 互联互通 / 互传（原 make.sh 明确保留） ---
product:app:=VoiceAssistant
product:app:=VoiceTrigger
product:app:=AiAsr
product:app:=MiuiVsimCore
product:app:=MiShare
product:app:=MiShare2
product:app:=MiuiShareExtension
product:app:=MiLinkService
product:app:=MiConnectService
product:app:=MIUIHuanJi
product:app:=Nearby
product:priv-app:=MiuiInterconnectivity

# --- HyperOS 4 / Android 17 新增 AI 组件（跨版本移植重点保护） ---
product:app:=HyperAI
product:app:=HyperAiEngine
product:app:=XiaomiAiEngine
product:app:=MiAiEngine
product:app:=AiAsr
product:app:=AiCaption
product:app:=AiTranslate
product:app:=MiAIAssistant
product:app:=SuperXiaoAi
product:app:=SuperXiaoiInputMethod
product:app:=MiuiXivideoThumbnail
product:app:=MiAIInput

# --- 相机 / 影像（机型资产已注入，禁止再删） ---
product:priv-app:=MiuiCamera
product:app:=CameraTools
product:app:=CameraTools_
product:app:=MiuiCamera-cal-ota
product:app:=MiAONService
product:app:=MiuiCameraUnitTest

# --- 跨大版本兼容组件（对照 <baseline-images> 已验证可开机包） ---
# 4.0.29 源包会移除这些目录，但 Android 17 system 跑在 Android 16 vendor 上时
# 缺失会导致开机停在 HyperOS 二屏（system_server 起不来 / 不发热 / pstore 空）。
# 一律保护，禁止被任何 remove_apps.conf 精简掉。
system:system/priv-app:=BuiltInPrintService
system:system/priv-app:=CallLogBackup
system:system/priv-app:=CellBroadcastServiceModulePlatform
system:system/priv-app:=MusicFX
system:system/priv-app:=Tag
system:system/priv-app:=UserDictionaryProvider

# --- 机型注入的同一批适配组件 ---
*:app:=PowerKeeper
*:app:=QColor
product:app:=MiuiMediaScanner

# --- 手机管家（安全服务）/ 主题壁纸：精简时必须保留 ---
*:priv-app:=MIUISecurityCenter
*:app:=MIUIThemeManager
